<!doctype html><html><head><meta charset='utf-8'><title>Applications</title></head><body style='font-family:Arial;max-width:800px;margin:40px auto'><h1>My Applications</h1>{% for application in applications %}<article style='border:1px solid #ddd;padding:15px;margin:12px 0'><h2>{{ application.job.title }}</h2><p>{{ application.job.company }} · {{ application.job.location }}</p><p>Status: <strong>{{ application.status }}</strong></p><small>Applied {{ application.created_at }}</small></article>{% empty %}<p>You have not applied to any jobs.</p>{% endfor %}<a href='{% url "job_list" %}'>Browse jobs</a></body></html>
