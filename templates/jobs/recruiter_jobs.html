<!doctype html><html><head><meta charset="utf-8"><title>Recruiter Dashboard</title></head><body><main><h1>Recruiter Dashboard</h1><p><a href="{% url 'create_job' %}">Post a new job</a> | <a href="{% url 'job_list' %}">Browse jobs</a></p>{% for job in jobs %}<article><h2>{{ job.title }}</h2><p>{{ job.company }} · {{ job.location }}</p><p><a href="{% url 'manage_applications' job.pk %}">View {{ job.applications.count }} applications</a></p></article>{% empty %}<p>No jobs posted yet.</p>{% endfor %}</main></body></html>
