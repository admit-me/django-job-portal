<!doctype html><html><head><meta charset='utf-8'><title>Job Portal</title></head><body style='font-family:Arial;max-width:900px;margin:40px auto'><h1>Python Jobs</h1><form><input name='q' placeholder='Job title'><input name='location' placeholder='Location'><button>Search</button></form><p><a href='{% url "my_applications" %}'>My Applications</a></p>{% for job in jobs %}<article style='border:1px solid #ddd;padding:18px;margin:14px 0;border-radius:8px'><h2><a href='{% url "job_detail" job.id %}'>{{ job.title }}</a></h2><p>{{ job.company }} · {{ job.location }}</p><p>{{ job.job_type }} · {{ job.salary }}</p><p>{{ job.skills }}</p></article>{% empty %}<p>No jobs found.</p>{% endfor %}</body></html>
